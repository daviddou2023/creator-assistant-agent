<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频证据复盘</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>视频证据复盘</h1>
        <div id="serviceStatus" class="status">待开始</div>
      </div>
      <span id="jobMeta" class="mono"></span>
    </header>

    <form id="reviewForm" class="request-layout">
      <div class="request-main">
        <label for="videoUrl">视频链接或 BV 号</label>
        <input id="videoUrl" name="video_url" placeholder="https://www.bilibili.com/video/BV..." required />
        <label for="question">你想查明什么？</label>
        <textarea id="question" name="user_question" rows="3" placeholder="例如：为什么点赞率较高，但评论互动偏少？" required></textarea>
        <div class="form-row">
          <label>创作者 ID<input name="creator_id" value="default_creator" /></label>
          <label>数据源
            <select name="platform"><option value="auto">自动识别</option><option value="bilibili">哔哩哔哩</option><option value="json">本地样例</option></select>
          </label>
          <label>发布后天数<input name="days_after_publish" type="number" value="30" min="1" /></label>
          <label>评论样本上限<input name="max_comments" type="number" value="50" min="1" /></label>
        </div>
        <button type="submit" class="primary">开始分析</button>
      </div>
      <aside class="hypothesis-picker">
        <div class="section-title">
          <h2>待验证假设</h2>
          <button id="refreshHypotheses" type="button" class="quiet">刷新</button>
        </div>
        <div id="hypothesisList" class="hypothesis-list"><p class="muted">输入创作者 ID 后加载</p></div>
      </aside>
    </form>

    <section class="execution" aria-label="执行计划">
      <div class="section-title"><h2>计划与执行</h2><span id="taskCount" class="muted"></span></div>
      <ol id="todoList" class="todo-list"></ol>
      <div id="eventLog" class="event-log" aria-live="polite"></div>
    </section>

    <section class="results">
      <div>
        <div class="section-title"><h2>取数结果</h2></div>
        <table class="data-table"><tbody id="metricsBody"><tr><td class="muted">尚无数据</td></tr></tbody></table>
        <div id="commentSignals" class="signals"></div>
      </div>
      <div>
        <div class="section-title"><h2>解释与证据</h2></div>
        <div id="explanations" class="explanations"><p class="muted">分析完成后显示结论、证据、置信度和限制。</p></div>
        <div class="section-title hypothesis-heading"><h2>新假设</h2></div>
        <div id="newHypotheses" class="explanations"></div>
      </div>
    </section>

    <section class="report-section">
      <div class="section-title"><h2>复盘报告</h2></div>
      <pre id="reportView" class="report"></pre>
      <div id="feedbackArea" class="feedback" hidden>
        <label for="correction">需要纠正或补充的内容</label>
        <textarea id="correction" rows="3" placeholder="例如：这条是长视频，请结合视频时长解释"></textarea>
        <div class="actions">
          <button id="rerunFeedback" type="button" class="secondary">提交纠偏并重跑</button>
          <button id="confirmReport" type="button" class="primary">报告准确，确认并沉淀经验</button>
        </div>
        <p id="feedbackStatus" class="muted" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
